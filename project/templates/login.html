{% extends "public_base.html" %}
{% block title %}Employee Login - CyberAttend{% endblock %}
{% block boxclass %}cyan{% endblock %}
{% block content %}
<h1>CYBERATTEND</h1>
<p class="sub">EMPLOYEE LOGIN &nbsp;//&nbsp; PASSWORD + FACE RECOGNITION</p>
<form method="POST" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>Username</label><input type="text" name="username" required autofocus></div>
    <div class="field"><label>Password</label><input type="password" name="password" required></div>
    <button class="btn cyan" type="submit">▶ CONTINUE TO FACE SCAN</button>
</form>
<div class="links">
    New employee? <a href="{{ url_for('register') }}">Create an account</a><br>
    <a href="{{ url_for('admin_login') }}" class="muted">Admin panel →</a>
</div>
{% endblock %}
